<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="cadastro.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="logo-text">
                    <h1>Novo Cadastro</h1>
                    <span class="user-name">Alan funcionario</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-section">
                <div class="form-header">
                    <div class="form-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div class="form-title">
                        <h2>Cadastro de Nova Conta</h2>
                        <p>Preencha os dados abaixo para criar sua conta</p>
                    </div>
                </div>

                <form class="registration-form" id="registrationForm">

                    <!-- Nome e Sobrenome -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">Nome</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Sobrenome</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>

                    <!-- EMAIL + TELEFONE -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefone</label>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>

                    <!-- CPF ADICIONADO AQUI -->
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" required placeholder="Somente números">

                        </div>
                    </div>

                    <!-- DATA + GÊNERO -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="birthDate">Data de Nascimento</label>
                            <input type="date" id="birthDate" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gênero</label>
                            <select id="gender" required>
                                <option value="">Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                                <option value="nao-informar">Prefiro não informar</option>
                            </select>
                        </div>
                    </div>

                    <!-- SENHAS -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Senha</label>
                            <input type="password" id="password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Senha</label>
                            <input type="password" id="confirmPassword" required>
                        </div>
                    </div>

                    <!-- ENDEREÇO -->
                    <div class="form-group full-width">
                        <label for="address">Endereço</label>
                        <input type="text" id="address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Cidade</label>
                            <input type="text" id="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">Estado</label>
                            <select id="state" required>
                                <option value="">Selecione</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="PR">Paraná</option>
                                <!-- Adicione outros estados se quiser -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="zipCode">CEP</label>
                            <input type="text" id="zipCode" required>
                        </div>
                    </div>

                    <!-- AÇÕES -->
                    <div class="form-actions">
                        <p>Já possui uma conta? <a href="login.html">Login</a></p>
                        <button type="button" class="btn btn-secondary" onclick="clearForm()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Criar Conta
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

</body>
</html>
