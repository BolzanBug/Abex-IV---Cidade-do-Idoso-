<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio — Gestão</title>
    <link rel="stylesheet" href="funcionario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="staff-layout">
    <header class="header">
        <div class="header-container staff-header-bar">
            <div class="title-section">
                <h1 class="main-title">Cardápio</h1>
                <p class="subtitle">Itens da semana</p>
            </div>
            <button type="button" class="staff-btn staff-btn-logout" onclick="staffLogout()">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="staff-back-row">
            <a href="funcionario-home.html" class="staff-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao painel</a>
        </div>

        <div class="staff-panel">
            <h2>Novo item</h2>
            <form id="form-item" class="staff-form-grid">
                <label>Dia (rótulo)
                    <input type="text" id="c-dia" required maxlength="60" placeholder="Segunda-feira" autocomplete="off">
                </label>
                <label>Ordem do dia
                    <input type="number" id="c-ordem-dia" required min="0" value="1">
                </label>
                <label>Ordem da refeição
                    <input type="number" id="c-ordem-ref" required min="0" value="1">
                </label>
                <label>Refeição
                    <input type="text" id="c-refeicao" required maxlength="40" placeholder="Almoço" autocomplete="off">
                </label>
                <label>Título
                    <input type="text" id="c-titulo" required maxlength="200" autocomplete="off">
                </label>
                <label>Descrição
                    <textarea id="c-descricao" rows="3" required maxlength="600"></textarea>
                </label>
                <label>URL da imagem
                    <input type="url" id="c-img" required maxlength="500" placeholder="https://…">
                </label>
                <button type="submit" id="btn-add-cardapio" class="staff-btn staff-btn-primary"><i class="fas fa-plus" aria-hidden="true"></i> Adicionar</button>
            </form>
        </div>

        <div class="staff-panel">
            <h2>Itens cadastrados</h2>
            <div class="staff-table-wrap">
                <table class="staff-table" id="tabela-cardapio">
                    <thead>
                        <tr>
                            <th>Dia</th>
                            <th>Refeição</th>
                            <th>Título</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="api-base.js"></script>
    <script src="funcionario-common.js"></script>
    <script src="funcionario-cardapio.js"></script>
</body>
</html>
