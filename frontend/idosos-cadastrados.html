<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Idosos - Cidade dos Idosos</title>
    <link rel="stylesheet" href="home-styles.css">
    <link rel="stylesheet" href="idosos-cadastrados.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <img src="./IMAGENS/pasted_file_QqQlpv_Roberto-Carlos-2-1024x683.jpg" alt="Roberto Carlos" class="logo">
                <div class="title-section">
                    <h1 class="main-title">Roberto Carlos</h1>
                    <p class="subtitle">Chapecó - Santa Catarina</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container-lista">
            <div class="page-header">
                <h2><i class="fas fa-users"></i> Idosos Cadastrados</h2>
                <button class="btn-novo" onclick="window.location.href='cadastro.html'">
                    <i class="fas fa-plus"></i> Novo Cadastro
                </button>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou telefone...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome Completo</th>
                            <th>Idade</th>
                            <th>Telefone</th>
                            <th>Bairro</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaIdosos">
                        <tr>
                            <td colspan="6" class="loading-row">
                                <div class="spinner-small"></div> Carregando dados...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination">
                <button class="page-btn" disabled><i class="fas fa-chevron-left"></i></button>
                <span class="page-info">Página 1 de 5</span>
                <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-container">
            <a href="home.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item active">
                <i class="fas fa-users-cog"></i>
                <span>Admin</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Relatórios</span>
            </a>
        </div>
    </nav>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h4>Município de Chapecó</h4>
                <div class="contact-info">
                    <div class="contact-item"><i class="fas fa-phone"></i><span>(49) 2049-9462</span></div>
                    <div class="contact-item"><i class="fas fa-envelope"></i><span>cidadedoidoso@chapeco.sc.gov.br</span></div>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Portal Cidade do Idoso - Área Administrativa</p>
        </div>
    </footer>
</body>
</html>
