[project]
name = "sistema-provas"
version = "0.1.0"
description = ""
authors = [
    {name = "Gabriel Reis",email = "gabrielreispr@unochapeco.edu.br"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.128.3,<0.129.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "pdfplumber (>=0.11.9,<0.12.0)",
    "groq (>=1.0.0,<2.0.0)",
    "pymupdf4llm (>=0.2.9,<0.3.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "anthropic (>=0.79.0,<0.80.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev sistema_provas/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=sistema_provas -vv'
post_test = 'coverage html'

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
taskipy = "^1.14.1"
ruff = "^0.15.0"
factory-boy = "^3.3.3"
pytest-asyncio = "^1.3.0"
sqlalchemy = "^2.0.46"
aiosqlite = "^0.22.1"
freezegun = "^1.5.5"

